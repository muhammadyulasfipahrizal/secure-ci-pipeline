name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Setup and unit test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

  sonarqube:
    name: Sonarqube analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      
      - name: Sonarqube scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # If you wish to fail your job when the Quality Gate is red, uncomment the following lines. This would typically be used to fail a deployment.
      # - name: SonarQube quality gate
      #   uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  trivy:
    name: Trivy security scan
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t secure-ci-pipeline:latest .

      - name: Scan docker image with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-ci-pipeline:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0 # change to 1 if you want the workflow to fail on vulnerabilities

  build-and-push:
    name: Build and push docker image
    runs-on: ubuntu-latest
    needs: trivy

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to gitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/secure-ci-pipeline:latest .

      - name: Push docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/secure-ci-pipeline:latest